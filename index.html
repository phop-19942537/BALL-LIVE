<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Live Football Calculator</title>
    <style>
        :root {
            --primary: #10b981;
            --primary-dark: #059669;
            --card-bg: #1e293b;
            --text: #f8fafc;
            --muted: #94a3b8;
            --border: #334155;
        }

        * {
            box-sizing: border-box;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
        }

        body {
            background-color: transparent;
            margin: 0;
            padding: 8px;
            display: flex;
            justify-content: center;
        }

        .widget {
            width: 100%;
            max-width: 320px;
            background: var(--card-bg);
            border-radius: 12px;
            box-shadow: 0 8px 20px rgba(0, 0, 0, 0.4);
            padding: 14px;
            border: 1px solid var(--border);
            color: var(--text);
        }

        .header {
            margin-bottom: 10px;
            padding-bottom: 6px;
            border-bottom: 1px solid var(--border);
        }

        .header h3 {
            margin: 0;
            font-size: 14px;
            color: var(--primary);
        }

        .form-grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 8px;
            margin-bottom: 10px;
        }

        .form-group {
            display: flex;
            flex-direction: column;
        }

        label {
            font-size: 11px;
            color: var(--muted);
            margin-bottom: 3px;
        }

        input {
            background-color: #0f172a;
            border: 1px solid var(--border);
            border-radius: 6px;
            padding: 6px 8px;
            color: var(--text);
            font-size: 13px;
            outline: none;
            width: 100%;
        }

        input:focus {
            border-color: var(--primary);
        }

        button {
            width: 100%;
            background-color: var(--primary);
            color: white;
            border: none;
            border-radius: 6px;
            padding: 8px;
            font-size: 13px;
            font-weight: bold;
            cursor: pointer;
            transition: background-color 0.2s;
        }

        button:hover {
            background-color: var(--primary-dark);
        }

        .result-box {
            margin-top: 10px;
            background: #0f172a;
            border-radius: 8px;
            padding: 10px;
            border: 1px solid var(--border);
            display: none;
            text-align: center;
        }

        .result-title {
            font-size: 11px;
            color: var(--muted);
            margin-bottom: 4px;
        }

        .result-status {
            font-size: 16px;
            font-weight: bold;
            margin-bottom: 6px;
        }

        .result-detail {
            font-size: 12px;
            color: var(--text);
            padding-top: 6px;
            border-top: 1px dashed var(--border);
            display: flex;
            justify-content: space-between;
        }

        .badge-over { color: #34d399; }
        .badge-under { color: #f87171; }
        .badge-safe { color: #60a5fa; }
    </style>
</head>
<body>

    <div class="widget">
        <div class="header">
            <h3>⚽ วิเคราะห์บอลสด (Live O/U)</h3>
        </div>
        
        <div class="form-grid">
            <div class="form-group">
                <label for="currentMinute">นาทีปัจจุบัน</label>
                <input type="number" id="currentMinute" placeholder="เช่น 60" min="1" max="95">
            </div>

            <div class="form-group">
                <label for="currentGoals">สกอร์สดรวมตอนนี้</label>
                <input type="number" id="currentGoals" placeholder="เช่น 1" min="0" max="15">
            </div>

            <div class="form-group">
                <label for="shotsOnTarget">ยิงตรงกรอบรวม</label>
                <input type="number" id="shotsOnTarget" placeholder="เช่น 5" min="0">
            </div>

            <div class="form-group">
                <label for="lineOverUnder">ราคา O/U สด</label>
                <input type="number" step="0.25" id="lineOverUnder" placeholder="เช่น 2.25">
            </div>
        </div>

        <button onclick="calculateRealLive()">คำนวณโอกาส</button>

        <div class="result-box" id="resultBox">
            <div class="result-title">ผลการวิเคราะห์บอลสด</div>
            <div class="result-status" id="resRecommendation">-</div>
            <div class="result-detail">
                <span>คาดการณ์จบเกม:</span>
                <span id="resTotalFinal">-</span>
            </div>
        </div>
    </div>

    <script>
        function calculateRealLive() {
            const minuteInput = document.getElementById('currentMinute').value;
            const goalsInput = document.getElementById('currentGoals').value;
            const shotsInput = document.getElementById('shotsOnTarget').value;
            const lineInput = document.getElementById('lineOverUnder').value;

            if (minuteInput === '' || goalsInput === '' || shotsInput === '' || lineInput === '') {
                alert('กรุณากรอกข้อมูลให้ครบทุกช่องก่อนคำนวณครับ');
                return;
            }

            const minute = parseFloat(minuteInput);
            const currentGoals = parseFloat(goalsInput);
            const shots = parseFloat(shotsInput);
            const line = parseFloat(lineInput);

            const remainingMinutes = Math.max(0, 95 - minute);
            const shotsPerMinute = shots / Math.max(1, minute);
            
            // ประเมินโอกาสเกิดประตูเพิ่มจากความถี่ในการยิงตรงกรอบ
            const expectedExtraGoals = (shotsPerMinute * remainingMinutes) * 0.28;
            const estimatedFinalGoals = currentGoals + expectedExtraGoals;

            document.getElementById('resTotalFinal').innerText = `${estimatedFinalGoals.toFixed(2)} ประตู`;

            const recBox = document.getElementById('resRecommendation');
            
            // คำนวณส่วนต่างเพื่อตัดสินว่า "มีโอกาสสูง" หรือ "มีโอกาสต่ำ"
            const diff = estimatedFinalGoals - line;

            if (diff >= 0.3) {
                recBox.innerHTML = `<span class="badge-over">🔥 มีโอกาสสูง (${(50 + diff * 30).toFixed(0)}%)</span>`;
            } else if (diff <= -0.3) {
                recBox.innerHTML = `<span class="badge-under">🛡️ มีโอกาสต่ำ (${(50 + Math.abs(diff) * 30).toFixed(0)}%)</span>`;
            } else {
                recBox.innerHTML = `<span class="badge-safe">⚠️ โอกาส 50/50 (รอดูราคา)</span>`;
            }

            document.getElementById('resultBox').style.display = 'block';
        }
    </script>

</body>
</html>
